name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: dotnet build ./src/Mike.Tests/Mike.Tests.csproj -c Release
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
