name: Public safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Audit public tree
        shell: pwsh
        run: ./scripts/audit-public-release.ps1 -Root . -ScanGitHistory

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Test .NET projects
        shell: pwsh
        run: dotnet test ./src/Mike.Tests/Mike.Tests.csproj -c Release
